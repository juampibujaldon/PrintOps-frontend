name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Imagen Docker (nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -t printops-web:ci .
      # Valida la configuración de nginx con el template ya resuelto.
      - name: nginx -t
        run: docker run --rm -e PORT=8080 -e BACKEND_URL=http://127.0.0.1:9 printops-web:ci sh -c '/docker-entrypoint.sh nginx -t'
